<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lumen Cockpit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E0E0C">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<!-- O iPad ignora o webmanifest ao "Adicionar à Tela de Início": quem decide se o
     painel abre sem a barra do Safari são estas linhas. Sem elas o atalho abre
     dentro do navegador, com a barra de endereço comendo o topo da tela.

     `black` e não `black-translucent`: com translúcido o iOS desenha a barra de
     status POR CIMA da página, e como o cabeçalho começa no pixel zero ela
     cobria metade dele — o relógio, o clima e a engrenagem ficavam atrás da
     hora e da bateria do iPad. Com `black` a página começa abaixo da barra.
     O recuo de segurança no CSS lá embaixo cobre o caso de algum iPadOS
     insistir em sobrepor mesmo assim. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F8F7F4;
    --dark:#1A1A1A;
    --stone:#6B6B5E;
    --stone-soft:#9B9B8E;
    --border:#E5E5E0;
    --orange:#FF6B35;
    --orange-soft:#FF8F5E;
    --green:#52B788;
    --green-soft:#74C69D;
    --blue:#4361EE;
    --blue-soft:#6B7FFF;
    --white:#FFFFFF;
    --canvas-bg:#0E0E0C;
    --text-on-dark:#F2F1EC;
    --stone-on-dark:#8C8C7F;
    --border-on-dark:rgba(255,255,255,.08);
    --lumen-teal:#217361;
    --lumen-orange:#E97849;
    --lumen-off:#FAFAFA;

    --sans:'Inter','Helvetica Neue',Arial,sans-serif;
    --display:'Plus Jakarta Sans','Inter','Helvetica Neue',Arial,sans-serif;

    /* as mesmas cores dos blocos, em versão sólida, para as bolinhas do painel */
    --cor-vermelho:#DC2626;
    --cor-amarelo:#EAB308;
    --cor-azul:#2563EB;
    --cor-laranja:#EA580C;
    --cor-verde:#16A34A;
    --cor-violeta:#7C3AED;
    --cor-coral:#EA4E24;
    --cor-ambar:#D97706;
    --cor-lima:#58900E;
    --cor-turquesa:#0D9488;
    --cor-anil:#4F46E5;
    --cor-magenta:#C026D3;
    --cor-vinho:#A81845;
    --cor-terra:#92400E;
    --cor-musgo:#4D7C0F;
    --cor-marinho:#1E40AF;
    --cor-grafite:#3A3A36;
    --cor-chumbo:#484848;
    --cor-ardosia:#526074;
    --cor-pedra:#6B6B5E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--canvas-bg);
    overflow:hidden;
    height:100%;
    width:100%;
  }
  /* touchscreen: sem atraso de clique, sem realce azul, sem seleção acidental de texto */
  body{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
    cursor:default;
    /* Rede de segurança para o app na Tela de Início do iPad: se o iOS resolver
       desenhar a barra de status por cima da página, este recuo empurra o
       painel para baixo dela. Em navegador comum, e sempre que a barra não
       sobrepõe, o valor é 0 e nada muda. O JS do canvas desconta esta altura
       para o painel não passar do fim da tela. */
    padding-top:env(safe-area-inset-top, 0px);
  }
  #canvas{
    background:var(--canvas-bg);
    font-family:var(--sans);
    color:var(--text-on-dark);
    /* Fixo, e não relativo, por causa do Safari do iPad.
       O canvas mede 1920px de largura no layout — o `transform: scale()` abaixo
       encolhe o desenho, nunca a caixa. Num navegador de mesa o
       `overflow:hidden` do body corta essa sobra e ninguém percebe; o iOS, em
       vez de cortar, estica a viewport até caber os 1920px. A partir daí
       `window.innerWidth` devolve 1920 em vez da largura real do iPad, a conta
       da escala dá 1, e o painel é desenhado em tamanho cheio vazando pela
       direita — nas duas orientações, porque `innerWidth > innerHeight` também
       impede o modo retrato de ligar.
       Fora do fluxo, a caixa não tem como esticar viewport nenhuma. */
    position:fixed;
    top:0;
    left:0;
    width:1920px;
    height:1080px;
    overflow:hidden;
    transform-origin:top left;
  }
  a{text-decoration:none; color:inherit;}

  /* ambient circular graphic, echoing the Lumen mark */
  .orb{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
  }
  .orb-1{width:640px;height:640px; background:radial-gradient(circle at 30% 30%, rgba(67,97,238,.10), transparent 70%); top:-220px; right:-160px;}
  .orb-2{width:480px;height:480px; background:radial-gradient(circle at 30% 30%, rgba(255,107,53,.08), transparent 70%); bottom:-180px; left:220px;}

  /* ===== TOP BAR ===== */
  .topbar{
    position:relative;
    z-index:2;
    height:104px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 48px;
    border-bottom:1px solid var(--border-on-dark);
  }
  .brand{display:flex; align-items:center;}
  /* `gap` em flexbox só chegou no Safari 14; margem no irmão seguinte faz o
     mesmo e vale em qualquer navegador. Vários pares assim daqui para baixo. */
  .brand > * + *{margin-left:24px;}
  .brand-mark{
    display:flex;
    align-items:center;
    height:62px;
  }
  .brand-mark .bar + .bar{margin-left:8px;}
  .brand-mark .bar{
    width:14px;
    border-radius:8px;
  }
  .brand-mark .b1{height:36px; background:var(--lumen-teal);}
  .brand-mark .b2{height:62px; background:var(--lumen-orange);}
  .brand-mark .b3{height:47px; background:var(--lumen-teal);}
  .brand-mark .b4{height:32px; background:var(--lumen-off);}
  .brand-mark .b5{height:26px; background:var(--lumen-orange); opacity:.85;}
  .brand-text{font-family:var(--display); font-weight:700; font-size:40px; letter-spacing:-0.02em; color:var(--text-on-dark);}
  .brand-text span{color:var(--lumen-orange);}
  .brand-sub{font-size:14px; font-weight:600; letter-spacing:1.8px; text-transform:uppercase; color:var(--stone-on-dark); margin-top:3px;}

  .top-right{display:flex; align-items:center;}
  /* A engrenagem que a ponte injeta entra antes do botão de tela cheia; como
     a regra é por irmão, ela ganha o espaçamento sozinha, sem ajuste no JS. */
  .top-right > * + *{margin-left:24px;}
  /* Botão de tela cheia, para o painel aberto no navegador do Mac.
     No iPad ele não aparece: o Safari não tem a API de tela cheia, e lá quem
     resolve isso é o atalho na Tela de Início. O JS lá embaixo o esconde. */
  /* Borda branca de propósito: com a borda quase invisível de antes, os dois
     botões pareciam menores do que são. O símbolo também clareia junto. */
  .fs-btn{
    width:54px; height:54px; border-radius:17px;
    border:2px solid var(--text-on-dark);
    background:transparent;
    color:var(--text-on-dark);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; line-height:1; cursor:pointer;
    padding:0;
    transition:background .12s ease, color .12s ease, transform .08s ease;
  }
  .fs-btn:active{background:rgba(255,255,255,.16); transform:scale(.94);}
  /* Precisa vir depois do display:flex acima, senão o atributo `hidden` que o
     JS põe no iPad não teria efeito nenhum. */
  .fs-btn[hidden]{display:none;}
  /* ===== CLIMA =====
     Fica escondido até a primeira resposta chegar: um painel com "--°" parado
     no alto é pior do que um painel sem clima. Se a consulta falhar, some. */
  .clima{display:flex; align-items:center;}
  .clima > * + *{margin-left:12px;}
  .clima[hidden]{display:none;}
  .clima-icone{font-size:34px; line-height:1;}
  .clima-temp{
    font-family:var(--display); font-size:26px; font-weight:700;
    letter-spacing:-0.02em; color:var(--text-on-dark);
    font-variant-numeric:tabular-nums;
  }
  .clima-linha{font-size:15px; color:var(--stone-on-dark); margin-top:2px; white-space:nowrap;}

  /* Data e hora lado a lado, data primeiro. Alinhadas pela linha de base para
     que os dois tamanhos diferentes assentem no mesmo pé. */
  .clock{display:flex; align-items:baseline; justify-content:flex-end;}
  .clock > * + *{margin-left:16px;}
  .clock-time{font-family:var(--display); font-size:40px; font-weight:700; letter-spacing:-0.02em; color:var(--text-on-dark); font-variant-numeric:tabular-nums;}
  /* Mesma fonte, tamanho e cor do horário: as duas passam a ler como uma
     informação só, em vez de um título com legenda. */
  .clock-date{font-family:var(--display); font-size:40px; font-weight:700;
    letter-spacing:-0.02em; color:var(--text-on-dark); white-space:nowrap;}
  /* o avatar acompanha os dois botões: os três eram 44px e formavam um conjunto */
  .profile{
    width:54px; height:54px; border-radius:50%;
    background:linear-gradient(135deg,var(--blue),var(--blue-soft));
    display:flex; align-items:center; justify-content:center;
    color:white; font-weight:700; font-family:var(--display); font-size:18px;
  }

  /* ===== LAYOUT =====
     Flexbox, e não grid, de propósito: o iPad que usa este painel roda iOS 9,
     cujo Safari é de antes do CSS Grid existir. Com grid a página não quebrava
     um pouco — ela caía inteira, porque `display:grid` vira `block` e todas as
     colunas empilham. Flexbox funciona nele e nos navegadores de hoje, então é
     um arquivo só para os dois. Mesma razão para não haver `gap` em lugar
     nenhum daqui para baixo: `gap` em flexbox só chegou no Safari 14. */
  .layout{
    position:relative; z-index:2;
    display:flex;
    /* a altura do canvas é definida pelo JS conforme a janela, então aqui é
       proporção e não um número fixo — do contrário sobrariam faixas pretas
       em qualquer tela que não fosse 16:9. */
    height:calc(100% - 104px);
  }
  .main{
    padding:40px 48px 40px 48px; overflow:hidden;
    display:flex; flex-direction:column;
    /* ocupa o que sobrar da largura; o min-width:0 impede que um bloco largo
       empurre a coluna lateral para fora da tela */
    flex:1 1 auto; min-width:0;
  }

  /* ===== RETRATO =====
     O iPad às vezes é usado em pé. A coluna lateral desce para baixo da
     grade, e os dois cartões passam a dividir a largura em vez de empilhar. */
  #canvas.retrato .layout{
    /* Grade e atalhos ficam com a altura natural, um debaixo do outro, e a
       sobra cai no fim da tela. Esticar a grade jogaria os atalhos para a
       borda de baixo e abriria um vão preto no meio da página — pior do que
       a sobra ficar toda numa ponta só. */
    flex-direction:column;
  }
  #canvas.retrato .main{
    padding:40px 48px 12px 48px;
    flex:0 0 auto;   /* altura natural */
  }
  /* Em pé as colunas dividem a largura em vez de serem 200px fixos. São 5:
     com 3 os blocos ficavam grandes demais para o pouco que cada um mostra.
     A grade fica ancorada no topo e a faixa de atalhos embaixo, então a sobra
     de altura cai entre as duas — separando as seções, em vez de virar uma
     borda preta numa das pontas. */
  /* Cinco por linha em pé. Como o canvas em pé tem 1080 fixos e o .main come
     48 de cada lado, sobram 984: cinco blocos de 176 mais 20 de margem cada um
     dão 980 e cabem com folga. Conta fechada em pixels justamente porque a
     largura do canvas nunca muda. */
  /* Em pé os mesmos 300px dão 3 por linha: 3 x (300+20) = 960, dentro dos 984
     que sobram dos 1080 do canvas menos os 48 de recuo de cada lado. */
  #canvas.retrato .launch-grid .tile{
    width:300px;
    height:300px;
  }

  /* Em pé a barra de cima tem 1080 de largura em vez de 1920, e o clima entrou
     nela. Sem estes cortes a marca quebrava em duas linhas e vazava dos 104px
     de altura. Sai o subtítulo, que é decorativo, e a cidade do clima, que já
     está implícita — ficam o ícone, a temperatura e a máxima/mínima. */
  #canvas.retrato .brand-sub{ display:none; }
  #canvas.retrato .brand-text{ font-size:34px; }
  #canvas.retrato .top-right > * + *{ margin-left:16px; }
  #canvas.retrato .clima-cidade{ display:none; }
  /* Em pé sai também a linha de condição e máxima/mínima, ficando só o ícone e
     a temperatura. Com o relógio maior, a barra de 1080 não comporta os dois
     inteiros: medido, o conjunto passava de 826 numa tela de 768. O que sai é o
     detalhe; o que fica é o que se lê de longe. */
  #canvas.retrato .clima-linha{ display:none; }
  /* Em pé fica "13 de agosto", sem o dia da semana: a data continua no tamanho
     grande que se pede numa tela pequena, e a barra deixa de depender do
     comprimento do nome do dia. */
  #canvas.retrato .clock-semana{ display:none; }
  /* Em pé a barra tem 1080 e não 1920, e o par data+hora é o item mais largo
     dela. Os dois descem juntos, para continuarem do mesmo tamanho um do outro.
     Medido com a data mais longa em pé ("31 de dezembro"): com 40px a folga era
     de 9px, o que não sobrevive à troca do mês. */
  #canvas.retrato .clock-time,
  #canvas.retrato .clock-date{ font-size:32px; }

  .section-title{
    font-family:var(--display); font-size:24px; font-weight:700; letter-spacing:-0.02em;
    margin-bottom:24px;
    color:var(--text-on-dark);
  }

  /* ===== LAUNCH GRID ===== */
  .launch-grid{
    /* flexbox com quebra faz o mesmo que `repeat(auto-fill, 200px)` fazia:
       entram quantos blocos couberem na largura, em vez de esticarem para
       preencher. O vão de 20px vira margem em cada bloco, porque `gap` não
       existe no Safari do iPad. */
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    flex:1;
    min-height:0;
    /* se um dia houver blocos demais para caber, rola em vez de cortar */
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,255,255,.16) transparent;
  }
  .launch-grid::-webkit-scrollbar{width:8px;}
  .launch-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16); border-radius:8px;}
  .launch-grid::-webkit-scrollbar-track{background:transparent;}
  .tile{
    /* Quadrado por altura declarada, e não por `aspect-ratio` — que só existe
       no Safari 15. Dá para fixar em pixels porque o canvas tem largura
       constante (1920 deitado, 1080 em pé) e é o `transform: scale` que o
       ajusta à tela; nada aqui depende do tamanho real do aparelho. */
    width:300px;
    height:300px;
    flex:0 0 auto;
    margin:0 20px 20px 0;
    border-radius:32px;
    padding:32px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
    overflow:hidden;
    color:white;
    box-shadow:0 8px 24px -12px rgba(0,0,0,.18);
    transition:transform .1s ease, box-shadow .1s ease, filter .1s ease;
  }
  /* feedback tátil: numa tela de toque não existe hover, então o retorno é no toque */
  a.tile{cursor:pointer;}
  a.tile:active{
    transform:scale(.97);
    filter:brightness(1.12);
    box-shadow:0 4px 14px -10px rgba(0,0,0,.3);
  }
  .tile-icon{
    width:74px; height:74px; border-radius:22px;
    background:rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center;
    font-size:34px;
    backdrop-filter:blur(4px);
  }
  .tile-name{font-family:var(--display); font-size:28px; font-weight:700; letter-spacing:-0.01em;}
  .tile-meta{font-size:17px; opacity:.85; margin-top:5px;}
  /* seta = "abre em outra aba". Substitui as bolinhas de status do mockup,
     que davam a entender que a página sabia se o deploy estava no ar — ela não sabe. */
  .tile-arrow{
    position:absolute; top:22px; right:24px;
    font-size:17px; line-height:1; opacity:.55;
  }

  /* ===== PALETA — círculo cromático de 12 raios + profundas + neutras =====
     A ordem aqui é a mesma da tela de ajuste. Cores vizinhas no círculo se
     parecem por definição: é o espaçamento regular de 30° que dá a estrutura,
     não a distância entre elas. */

  /* Primárias */
  .t-vermelho{background:linear-gradient(145deg,#DC2626,#EF4444);}
  .t-amarelo {background:linear-gradient(145deg,#EAB308,#FACC15);}
  .t-azul    {background:linear-gradient(145deg,#2563EB,#3B82F6);}

  /* Secundárias */
  .t-laranja {background:linear-gradient(145deg,#EA580C,#F97316);}
  .t-verde   {background:linear-gradient(145deg,#16A34A,#22C55E);}
  .t-violeta {background:linear-gradient(145deg,#7C3AED,#9B5DF5);}

  /* Terciárias — cada uma entre duas das anteriores */
  .t-coral   {background:linear-gradient(145deg,#EA4E24,#F97350);} /* vermelho-laranja */
  .t-ambar   {background:linear-gradient(145deg,#D97706,#F59E0B);} /* amarelo-laranja  */
  .t-lima    {background:linear-gradient(145deg,#4D7C0F,#65A30D);} /* amarelo-verde    */
  .t-turquesa{background:linear-gradient(145deg,#0D9488,#14B8A6);} /* azul-verde       */
  .t-anil    {background:linear-gradient(145deg,#4F46E5,#6366F1);} /* azul-violeta     */
  .t-magenta {background:linear-gradient(145deg,#C026D3,#D946EF);} /* vermelho-violeta */

  /* Profundas — a mesma volta do círculo, em versão escura */
  .t-vinho   {background:linear-gradient(145deg,#881337,#A81845);}
  .t-terra   {background:linear-gradient(145deg,#78350F,#92400E);}
  .t-musgo   {background:linear-gradient(145deg,#365314,#4D7C0F);}
  .t-marinho {background:linear-gradient(145deg,#1E3A8A,#1E40AF);}

  /* Neutras */
  .t-grafite {background:linear-gradient(145deg,#1A1A1A,#3A3A36);}
  .t-chumbo  {background:linear-gradient(145deg,#2b2b2b,#484848);}
  .t-ardosia {background:linear-gradient(145deg,#475569,#64748B);}
  .t-pedra   {background:linear-gradient(145deg,#6B6B5E,#8A8A7A);}

  /* O amarelo é claro demais para texto branco. Em vez de escurecê-lo até
     virar mostarda — perdendo justamente a cor básica que faltava — ele
     inverte o texto. É a única exceção da paleta. */
  .t-amarelo{color:#1A1A18;}
  .t-amarelo .tile-icon{background:rgba(0,0,0,.15);}
  .t-amarelo .tile-badge{background:rgba(0,0,0,.18);}
  .t-amarelo .tile-arrow{opacity:.5;}

  .tile-badge{
    display:inline-block;
    font-size:14px; font-weight:700; letter-spacing:.8px; text-transform:uppercase;
    background:rgba(255,255,255,.2); padding:7px 14px; border-radius:20px;
  }

  /* ===== SIDE PANEL ===== */


</style>
</head>
<body>
<div id="canvas">

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <div class="bar b1"></div>
        <div class="bar b2"></div>
        <div class="bar b3"></div>
        <div class="bar b4"></div>
        <div class="bar b5"></div>
      </div>
      <div>
        <div class="brand-text">Lumen <span>Cockpit</span></div>
        <div class="brand-sub">Painel de comando — Lumen Labs</div>
      </div>
    </div>
    <div class="top-right">
      <button class="fs-btn" id="fsBtn" type="button" title="Tela cheia" aria-label="Alternar tela cheia">⛶</button>
      <div class="clima" id="clima" hidden>
        <div class="clima-icone" id="climaIcone"></div>
        <div>
          <div class="clima-temp" id="climaTemp"></div>
          <div class="clima-linha" id="climaLinha"></div>
        </div>
      </div>
      <!-- data antes da hora: as duas na mesma linha, com a data à esquerda -->
      <div class="clock">
        <div class="clock-date" id="clockDate">&nbsp;</div>
        <div class="clock-time" id="clockTime">--:--</div>
      </div>
      <div class="profile">EM</div>
    </div>
  </div>

  <!-- Só a grade. Os grupos APPs e Extras saíram: nesta tela de 9,7 polegadas
       eles roubavam largura dos botões grandes, que são o que se usa de fato.
       O que estava neles continua gravado no blocos.local.json e volta a
       aparecer se um dia esta coluna for reposta. -->
  <div class="layout">
    <div class="main">
      <div class="section-title">Web</div>

      <div class="launch-grid" id="grade"></div>
    </div>
  </div>

</div>

<script>
  /* ── Montagem da página a partir de blocos.json ──
     Os botões não estão escritos aqui dentro: vêm do arquivo de configuração,
     que é o mesmo que a tela de ajuste grava e o que a ponte usa para saber
     quais endereços pode abrir. Uma fonte só. */
  var CONFIG = null;

  function elemento(tag, classe, texto){
    var el = document.createElement(tag);
    if (classe) el.className = classe;
    if (texto != null) el.textContent = texto;
    return el;
  }

  function montarBloco(bloco){
    var externo = (bloco.acao || '').indexOf('http') === 0;
    var a = elemento('a', 'tile t-' + (bloco.cor || 'grafite'));
    a.href = bloco.acao || '#';
    if (externo) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }

    a.appendChild(elemento('div', 'tile-arrow', externo ? '↗' : '⌘'));
    a.appendChild(elemento('div', 'tile-icon', bloco.icone || '•'));

    var base = document.createElement('div');
    if (bloco.selo) {
      var selo = elemento('div', 'tile-badge', bloco.selo);
      selo.style.marginBottom = '10px';
      base.appendChild(selo);
    }
    base.appendChild(elemento('div', 'tile-name', bloco.nome || ''));
    base.appendChild(elemento('div', 'tile-meta', bloco.descricao || ''));
    a.appendChild(base);
    return a;
  }


  function desenhar(config){
    CONFIG = config;

    var grade = document.getElementById('grade');
    grade.textContent = '';
    (config.blocos || []).forEach(function(b){ grade.appendChild(montarBloco(b)); });

    /* `apps` e `status` continuam no arquivo de configuração, intocados — só não
       têm mais onde aparecer. A ponte também não os regrava, então nada se perde
       se a coluna voltar um dia. */

    document.dispatchEvent(new CustomEvent('cockpit:desenhado'));
  }

  /* ── Buscar JSON sem `fetch` ──
     O `fetch` só chegou no Safari 10.1, e o iPad que usa este painel roda iOS 9.
     Isso não degradava o painel: `fetch` nem existe como função lá, então a
     linha que carregava os botões lançava ReferenceError e derrubava o script
     INTEIRO. Tudo abaixo dela deixava de rodar — inclusive o dimensionamento do
     canvas, e sem ele a página ficava no tamanho fixo de 1920px mostrando só o
     canto superior esquerdo. Cabeçalho, relógio e engrenagem ficavam fora da
     tela: era este o bug, e não o layout.

     XMLHttpRequest existe desde sempre e faz o mesmo aqui. As Promises
     continuam, porque essas o Safari 9 já tem. */
  function buscarJSON(url){
    return new Promise(function(resolver, rejeitar){
      var req = new XMLHttpRequest();
      /* sem `cache: no-store`, que é opção do fetch: o parâmetro variável
         cumpre o mesmo papel de nunca servir uma cópia velha */
      req.open('GET', url + (url.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), true);
      req.onload = function(){
        if (req.status < 200 || req.status >= 300) {
          return rejeitar(new Error('HTTP ' + req.status));
        }
        try { resolver(JSON.parse(req.responseText)); }
        catch (e) { rejeitar(e); }
      };
      req.onerror = function(){ rejeitar(new Error('falha de rede')); };
      req.send();
    });
  }

  function carregar(){
    return buscarJSON('blocos.json')
      .then(desenhar)
      .catch(function(){
        document.getElementById('grade').appendChild(
          elemento('div', 'tile t-grafite', 'Não consegui ler o blocos.json'));
      });
  }
  carregar();

  /* ── Canvas escalável ──
     A página é desenhada numa largura fixa e ampliada até preencher a tela.
     Deitado essa largura é 1920: numa tela 4K (3840x2160) a escala é exatamente
     2x, então tudo fica nítido e os blocos ficam com o dobro do tamanho físico
     — bons de tocar com o dedo. Em pé a largura base passa a 1080 e o layout
     empilha, porque o iPad às vezes é girado.

     A altura acompanha a janela em vez de ser fixa. Antes o canvas era 1080 de
     altura e a escala pegava o menor dos dois lados, o que deixava faixas
     pretas em cima e embaixo em qualquer tela que não fosse 16:9 — em pé
     sobrava mais faixa do que painel. */
  var canvas = document.getElementById('canvas');
  function fitCanvas(){
    var retrato = window.innerHeight > window.innerWidth;
    var base = retrato ? 1080 : 1920;
    var s = window.innerWidth / base;
    /* O recuo da barra de status do iPad (veja o padding no body). Quase sempre
       é 0; quando não é, esses pixels já foram gastos empurrando o painel para
       baixo, então precisam sair da altura — senão o pé do painel passaria do
       fim da tela pela mesma medida. */
    var recuo = parseFloat(getComputedStyle(document.body).paddingTop) || 0;
    /* add/remove explícitos: o segundo argumento do `toggle` é ignorado em
       WebKits antigos, e ali ele viraria um alternador de verdade — a página
       trocaria de orientação a cada redimensionamento. */
    if (retrato) canvas.classList.add('retrato');
    else canvas.classList.remove('retrato');
    canvas.style.width  = base + 'px';
    canvas.style.height = ((window.innerHeight - recuo) / s) + 'px';
    canvas.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', fitCanvas);
  fitCanvas();

  /* ── Relógio ── */
  var elTime = document.getElementById('clockTime');
  var elDate = document.getElementById('clockDate');
  /* Nomes escritos aqui, e não pedidos ao `toLocaleDateString`.

     O Safari do iOS 9 aceita o objeto de opções e o ignora: pedir
     `{weekday:'long'}` devolvia a data inteira, e pedir `{day, month}` também —
     as duas partes vinham iguais e a data aparecia duplicada, lado a lado. O
     mesmo valia para a hora, que saía com segundos porque `{hour, minute}` era
     descartado do mesmo jeito.

     Montando na mão o resultado é o mesmo em qualquer navegador, e o painel é
     em português fixo de qualquer forma. */
  var DIAS = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira',
              'Quinta-feira', 'Sexta-feira', 'Sábado'];
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
               'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  function doisDigitos(n){ return (n < 10 ? '0' : '') + n; }

  function tick(){
    var d = new Date();
    elTime.textContent = doisDigitos(d.getHours()) + ':' + doisDigitos(d.getMinutes());

    /* O dia da semana vai num elemento próprio para o CSS poder escondê-lo em
       pé, onde a barra tem 1080 e não 1920. */
    elDate.textContent = '';
    elDate.appendChild(elemento('span', 'clock-semana', DIAS[d.getDay()] + ', '));
    elDate.appendChild(document.createTextNode(d.getDate() + ' de ' + MESES[d.getMonth()]));
  }
  tick();
  setInterval(tick, 15000);

  /* ── Clima ──
     Quem consulta é o navegador que está mostrando o painel, direto na
     open-meteo.com: é aberta, não pede cadastro nem chave e responde com CORS
     liberado. A ponte não entra nisso — nada aqui toca no Mac, e nenhuma rota
     nova foi aberta no servidor.

     A cidade sai do `clima` no arquivo de configuração. A tela de ajuste
     preserva as chaves que não conhece, então esse trecho sobrevive a qualquer
     gravação de botões, e cada Mac pode apontar para uma cidade diferente. */
  var CLIMA_PADRAO = { nome: 'São Paulo', lat: -23.5505, lon: -46.6333 };

  /* Códigos WMO, que é o que a open-meteo devolve. Agrupados de propósito: o
     painel é lido de longe, então vale a figura, não a nuance. */
  function tempoDe(codigo){
    if (codigo === 0)  return { icone: '☀️',  texto: 'Céu limpo' };
    if (codigo <= 2)   return { icone: '🌤️', texto: 'Sol entre nuvens' };
    if (codigo === 3)  return { icone: '☁️',  texto: 'Nublado' };
    if (codigo <= 48)  return { icone: '🌫️', texto: 'Névoa' };
    if (codigo <= 57)  return { icone: '🌦️', texto: 'Garoa' };
    if (codigo <= 67)  return { icone: '🌧️', texto: 'Chuva' };
    if (codigo <= 77)  return { icone: '🌨️', texto: 'Neve' };
    if (codigo <= 82)  return { icone: '🌦️', texto: 'Pancadas de chuva' };
    if (codigo <= 86)  return { icone: '🌨️', texto: 'Neve' };
    return { icone: '⛈️', texto: 'Tempestade' };
  }

  function mostrarClima(){
    var c = (CONFIG && CONFIG.clima) || CLIMA_PADRAO;
    var url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude='  + encodeURIComponent(c.lat)
      + '&longitude=' + encodeURIComponent(c.lon)
      + '&current=temperature_2m,weather_code'
      + '&daily=temperature_2m_max,temperature_2m_min'
      + '&timezone=auto&forecast_days=1';

    buscarJSON(url)
      .then(function(d){
        var tempo = tempoDe(d.current.weather_code);
        document.getElementById('climaIcone').textContent = tempo.icone;
        document.getElementById('climaTemp').textContent =
          Math.round(d.current.temperature_2m) + '°';
        var linha = document.getElementById('climaLinha');
        linha.textContent = tempo.texto
          + ' · ' + Math.round(d.daily.temperature_2m_max[0]) + '°'
          + ' / ' + Math.round(d.daily.temperature_2m_min[0]) + '°';
        /* a cidade vai num elemento próprio para o CSS poder escondê-la em pé,
           onde a barra é mais estreita */
        if (c.nome) {
          var cidade = elemento('span', 'clima-cidade', ' · ' + c.nome);
          linha.appendChild(cidade);
        }
        document.getElementById('clima').hidden = false;
      })
      .catch(function(){
        /* sem internet, ou a api fora do ar: o painel segue sem o clima, em vez
           de mostrar um bloco parado com traços no lugar da temperatura */
        document.getElementById('clima').hidden = true;
      });
  }

  /* espera a configuração chegar para saber a cidade; depois, de meia em meia
     hora — bem mais rápido do que o tempo muda, e com um número irrisório de
     consultas */
  /* `{once: true}` como terceiro argumento só é entendido a partir do Safari 10;
     no 9 ele é lido como `useCapture` e o ouvinte nunca se remove. Removê-lo na
     mão faz o mesmo em qualquer versão. */
  function climaNaPrimeiraVez(){
    document.removeEventListener('cockpit:desenhado', climaNaPrimeiraVez);
    mostrarClima();
  }
  document.addEventListener('cockpit:desenhado', climaNaPrimeiraVez);
  setInterval(mostrarClima, 30 * 60 * 1000);

  /* ── Botão de tela cheia ──
     Serve o painel aberto no navegador do Mac, onde resolve no toque sem F11.

     O Safari do iPad não implementa a API de tela cheia para elementos comuns
     (só para vídeo), então lá o botão não teria como funcionar. Em vez de
     deixá-lo à toa esperando um toque que não faz nada, ele sai da barra: no
     iPad o painel fica em tela cheia pelo atalho na Tela de Início. */
  if (!document.documentElement.requestFullscreen) {
    document.getElementById('fsBtn').hidden = true;
  }
  document.getElementById('fsBtn').addEventListener('click', function(){
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen().catch(function(){ /* navegador recusou; sem problema */ });
    }
  });
  document.addEventListener('fullscreenchange', function(){
    document.getElementById('fsBtn').textContent = document.fullscreenElement ? '⛶' : '⛶';
  });

  /* ── Aposentadoria do service worker ──
     Existiu um sw.js aqui. Ele nunca funcionou no uso real: a página é servida
     por http num endereço da rede local, e os navegadores só registram service worker em
     https ou localhost. Esta limpeza desfaz os registros que sobraram dos
     testes feitos em localhost, que de outro modo ficariam para sempre. */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then(function(registros){ registros.forEach(function(r){ r.unregister(); }); })
      .catch(function(){});
  }
  if (window.caches && caches.delete) { caches.delete('cockpit-v1'); }
</script>

</body>
</html>
